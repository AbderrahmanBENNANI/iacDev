
- name: Configurer le site web
  hosts: localhost
  connection: local
  tasks:
    - name: Créer le dossier du site
      ansible.builtin.file:
        path: "{{ playbook_dir }}/site"
        state: directory
        mode: "0755"

    - name: Écrire la page d'accueil
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/site/index.html"
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Accueil</title>
          </head>
          <body>
            <h1>Bonjour depuis Ansible !</h1>
            <p>Serveur créé par Terraform, configuré par Ansible.</p>

          <BR>
            <p>modifications apportées :</p>
          </body>
          </html>
          
         